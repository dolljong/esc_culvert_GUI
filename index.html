<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESC Culvert - 암거 설계 프로그램</title>
    <!-- 인라인 파비콘 (별도 요청 없이 404 방지) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230066cc'/%3E%3Crect x='3' y='4' width='10' height='8' fill='none' stroke='white' stroke-width='1.5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tree.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
    <div class="main-layout">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-left">
                <button id="btn-toggle-tree" class="icon-btn" title="트리메뉴 보기/숨기기" aria-label="트리메뉴 보기/숨기기" aria-expanded="true">☰</button>
                <div class="header-title">ESC Culvert - 암거 설계 프로그램</div>
            </div>
            <nav class="header-menu">
                <button id="btn-new" class="menu-btn">새 프로젝트</button>
                <button id="btn-save" class="menu-btn" title="Ctrl+S">저장</button>
                <button id="btn-load" class="menu-btn" title="Ctrl+O">불러오기</button>
                <button id="btn-export-dxf" class="menu-btn">DXF 내보내기</button>
            </nav>
        </header>

        <!-- 메인 컨텐츠 -->
        <div class="content-area" id="content-area">
            <!-- 트리 네비게이션 -->
            <aside class="tree-panel" id="tree-panel">
                <div class="tree-header">메뉴</div>
                <ul id="tree-menu" class="tree-root">
                    <!-- JavaScript에서 동적 생성 -->
                </ul>
            </aside>

            <!-- 트리 / 본문 크기 조절 -->
            <div class="splitter splitter-v" id="splitter-tree" role="separator" aria-orientation="vertical" title="드래그하여 너비 조절"></div>

            <!-- 우측 패널 -->
            <main class="main-panel" id="main-panel">
                <!-- SVG 뷰어 -->
                <div class="viewer-panel">
                    <div class="viewer-toolbar">
                        <button id="btn-zoom-in" class="viewer-btn" title="확대">+</button>
                        <button id="btn-zoom-out" class="viewer-btn" title="축소">-</button>
                        <button id="btn-fit" class="viewer-btn" title="전체보기">⊡</button>
                        <span id="zoom-level" class="zoom-indicator">100%</span>
                    </div>
                    <div id="svg-container" class="svg-container">
                        <svg id="culvert-svg" xmlns="http://www.w3.org/2000/svg">
                            <!-- SVG 콘텐츠 동적 생성 -->
                        </svg>
                    </div>
                </div>

                <!-- 뷰어 / 폼 크기 조절 -->
                <div class="splitter splitter-h" id="splitter-form" role="separator" aria-orientation="horizontal" title="드래그하여 높이 조절"></div>

                <!-- 데이터 입력 폼 -->
                <div class="form-panel">
                    <div id="form-title" class="form-title">프로젝트 정보</div>
                    <div id="form-content" class="form-content">
                        <!-- JavaScript에서 동적 생성 -->
                    </div>
                </div>
            </main>
        </div>

        <!-- 상태 표시줄 -->
        <footer class="status-bar">
            <span id="status-message" class="status-message">기본 정보를 입력하세요</span>
            <span class="status-right">
                <span id="status-save" class="status-save">저장되지 않음</span>
                <span id="status-version" class="status-version"></span>
            </span>
        </footer>
    </div>

    <!-- JavaScript (ES 모듈) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
